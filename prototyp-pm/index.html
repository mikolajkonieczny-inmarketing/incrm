<title>inCRM Project Manager</title>
<meta name="description" content="Prototyp widoku Project Managera w CRM agencji inmarketing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: ciemny sidebar (Rich Black) + jasny obszar roboczy; Bittersweet = akcja, Air Force Blue = informacja/tier */
:root {
  --brand-coral: #FF6F61;
  --brand-blue: #27398A;
  --brand-black: #242726;

  --bg: #F4F5F8;
  --surface: #FFFFFF;
  --surface-2: #F1F2F6;
  --line: #E3E5EC;
  --line-strong: #CDD1DC;
  --fg: #242726;
  --fg-2: #454948;
  --muted: #6D717C;
  --faint: #A2A6B0;

  --accent: #FF6F61;
  --accent-ink: #D8412F;
  --accent-soft: #FFEBE8;
  --on-accent: #242726;

  --blue: #27398A;
  --blue-soft: #E7EAF6;
  --on-blue: #FFFFFF;

  --good: #17885A; --good-soft: #E2F4EB;
  --warn: #B26A00; --warn-soft: #FFF3DC; --warn-line: #F4D79A;
  --bad: #C9352A;  --bad-soft: #FDE8E6;

  --side-bg: #242726;
  --side-fg: #C9CBCA;
  --side-muted: #7F8482;
  --side-hover: #2F3331;
  --side-active: #363A38;

  --shadow: 0 1px 2px rgba(36,39,38,.05), 0 2px 8px rgba(36,39,38,.04);
  --font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Anton", "Poppins", Impact, "Arial Narrow", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181A19; --surface: #212423; --surface-2: #2A2E2C; --line: #333736; --line-strong: #454A48;
    --fg: #F0F1EF; --fg-2: #D3D5D3; --muted: #9DA2A0; --faint: #6E7371;
    --accent: #FF6F61; --accent-ink: #FF8C80; --accent-soft: #3A2522; --on-accent: #242726;
    --blue: #98A6EC; --blue-soft: #252B48; --on-blue: #141A38;
    --good: #4CC98F; --good-soft: #17322A; --warn: #F0B04A; --warn-soft: #33290F; --warn-line: #5A4718;
    --bad: #FF7B70; --bad-soft: #3A1E1C;
    --side-bg: #121413; --side-fg: #C9CBCA; --side-muted: #737876; --side-hover: #1E2120; --side-active: #282C2A;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181A19; --surface: #212423; --surface-2: #2A2E2C; --line: #333736; --line-strong: #454A48;
  --fg: #F0F1EF; --fg-2: #D3D5D3; --muted: #9DA2A0; --faint: #6E7371;
  --accent: #FF6F61; --accent-ink: #FF8C80; --accent-soft: #3A2522; --on-accent: #242726;
  --blue: #98A6EC; --blue-soft: #252B48; --on-blue: #141A38;
  --good: #4CC98F; --good-soft: #17322A; --warn: #F0B04A; --warn-soft: #33290F; --warn-line: #5A4718;
  --bad: #FF7B70; --bad-soft: #3A1E1C;
  --side-bg: #121413; --side-fg: #C9CBCA; --side-muted: #737876; --side-hover: #1E2120; --side-active: #282C2A;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-fg); position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; color: #fff; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand-coral); color: var(--brand-black); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.logo small { display: block; font-size: 10.5px; font-weight: 500; color: var(--side-muted); letter-spacing: .04em; }
.side-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--side-muted); padding: 16px 10px 6px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--side-fg); text-decoration: none; font-size: 13px; font-weight: 500; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--side-hover); color: #fff; }
.nav.on { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--brand-coral); }
.nav .tag { margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: #3A3E3C; color: var(--side-muted); }
.mod { display: flex; align-items: center; gap: 9px; padding: 5px 10px; font-size: 12px; color: var(--side-fg); }
.mod .dot { width: 7px; height: 7px; border-radius: 50%; background: #4CC98F; box-shadow: 0 0 0 3px rgba(76,201,143,.15); }
.mod.down { color: var(--side-muted); }
.mod.down .dot { background: #FF6F61; box-shadow: 0 0 0 3px rgba(255,111,97,.18); }
.mod .st { margin-left: auto; font-size: 10.5px; color: var(--side-muted); }
.side-foot { margin-top: auto; padding-top: 14px; display: grid; gap: 4px; }
.role { border: 1px solid #3A3E3C; border-radius: 10px; padding: 10px; font-size: 11.5px; color: var(--side-muted); display: grid; gap: 6px; }
.role b { color: #fff; font-weight: 600; font-size: 12.5px; }
.role-sw { display: flex; gap: 4px; }
.role-sw span { flex: 1; text-align: center; padding: 4px 0; border-radius: 6px; font-size: 10.5px; font-weight: 600; background: #2F3331; color: var(--side-muted); }
.role-sw span.on { background: var(--brand-coral); color: var(--brand-black); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 12px 28px; min-height: 60px; }
.top h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; border: 0; background: none; padding: 6px; margin-left: -6px; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 9px; padding: 7px 12px; width: 260px; color: var(--muted); }
.search input { border: 0; background: none; outline: none; width: 100%; font-size: 12.5px; }
.icon-btn { border: 0; background: none; padding: 7px; border-radius: 8px; color: var(--muted); position: relative; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn .badge { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-sizing: content-box; }
.me { display: flex; align-items: center; gap: 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.me-txt { text-align: right; line-height: 1.25; }
.me-txt b { display: block; font-size: 12.5px; font-weight: 600; }
.me-txt span { font-size: 11px; color: var(--muted); }
.sample { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--blue); background: var(--blue-soft); border-radius: 5px; padding: 3px 8px; white-space: nowrap; }

.page { padding: 24px 28px 48px; display: grid; gap: 18px; align-content: start; }

/* ---------- atoms ---------- */
.av { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.av.lg { width: 42px; height: 42px; border-radius: 11px; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.6; }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-aktywny { color: var(--good); background: var(--good-soft); }
.st-onboarding { color: var(--blue); background: var(--blue-soft); }
.st-zagrozony { color: var(--bad); background: var(--bad-soft); }
.st-wstrzymany { color: var(--warn); background: var(--warn-soft); }
.st-zakonczony { color: var(--muted); background: var(--surface-2); }
.svc { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
.svc.more { background: var(--surface-2); color: var(--muted); }
.tier { display: inline-grid; place-items: center; width: 26px; height: 24px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.tier-S { background: var(--blue); color: var(--on-blue); }
.tier-A { background: var(--blue-soft); color: var(--blue); }
.tier-B { background: var(--accent-soft); color: var(--accent-ink); }
.tier-C { background: var(--surface-2); color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--line-strong); }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(.96); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 7px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.card-h h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-h .aside { margin-left: auto; font-size: 12px; color: var(--muted); }
.card-b { padding: 14px 20px 18px; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.link { color: var(--accent-ink); font-weight: 600; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; }
.link:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.empty { padding: 26px; text-align: center; color: var(--muted); font-size: 12.5px; }

input.f, textarea.f, select.f { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; font-size: 13px; outline: none; }
input.f:focus, textarea.f:focus, select.f:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.f { resize: vertical; min-height: 110px; line-height: 1.55; }
select.f { width: auto; padding-right: 30px; }

/* ---------- dashboard ---------- */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hello h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.hello p { margin: 2px 0 0; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--font-num); font-size: 34px; line-height: 1.05; letter-spacing: .01em; }
.kpi .v small { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.kpi.hot { background: var(--brand-black); border-color: var(--brand-black); color: #fff; }
.kpi.hot .eyebrow, .kpi.hot .s { color: #B4B8B6; }
.kpi.hot .v { color: var(--brand-coral); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }

.att { display: grid; }
.att-row { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.att-row:first-child { border-top: 0; }
.sev { align-self: stretch; border-radius: 4px; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--blue); }
.att-row b { font-weight: 600; font-size: 13px; }
.att-row p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

.agenda { display: grid; gap: 2px; }
.ag-day { font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 0 4px; letter-spacing: .03em; }
.ag-day:first-child { padding-top: 0; }
.ag { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 12px; padding: 7px 0; align-items: start; }
.ag time { font-size: 12px; font-weight: 600; color: var(--fg-2); padding-top: 1px; }
.ag b { font-weight: 500; font-size: 12.5px; display: block; }
.ag span { font-size: 11.5px; color: var(--muted); }
.ag .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

.pulse { width: 100%; border-collapse: collapse; }
.pulse td, .pulse th { padding: 9px 8px; text-align: left; border-top: 1px solid var(--line); font-size: 12.5px; }
.pulse th { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; border-top: 0; padding-top: 0; }
.pulse tr[data-go] { cursor: pointer; }
.pulse tr[data-go]:hover td { background: var(--surface-2); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; width: 100%; min-width: 60px; }
.bar i { display: block; height: 100%; border-radius: 3px; }

.feed { display: grid; }
.fi { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 11px; padding: 10px 0; border-top: 1px solid var(--line); }
.fi:first-child { border-top: 0; padding-top: 0; }
.fi p { margin: 0; font-size: 12.5px; }
.fi .meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mods div { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 500; }
.mods .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.mods .down { border-color: var(--bad-soft); background: var(--bad-soft); color: var(--bad); }
.mods .down .dot { background: var(--bad); }
.mods small { margin-left: auto; font-size: 10.5px; color: var(--muted); font-weight: 400; }

/* ---------- projekty ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .search-f { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 11px; color: var(--muted); flex: 1 1 220px; max-width: 300px; }
.toolbar .search-f input { border: 0; outline: none; background: none; padding: 8px 0; width: 100%; font-size: 12.5px; color: var(--fg); }
.toolbar .sp { flex: 1; }
.count { font-size: 12px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 760px; }
.tbl th { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.cl b { display: block; font-weight: 600; font-size: 13.5px; }
.cl span { font-size: 11.5px; color: var(--muted); }
.svcs { display: flex; gap: 5px; flex-wrap: wrap; }
.money { font-weight: 600; white-space: nowrap; }
.money small { color: var(--muted); font-weight: 400; font-size: 11px; }
.go { color: var(--faint); }
tr:hover .go { color: var(--accent-ink); }
.warn-ic { color: var(--warn); }
.bad-ic { color: var(--bad); }

/* ---------- klient ---------- */
.crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--fg); }
.crumbs b { color: var(--fg); font-weight: 500; }
.hero { padding: 20px 22px; display: grid; gap: 18px; }
.hero-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hero h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; }
.hero .sub { font-size: 12.5px; color: var(--muted); }
.hero .acts { display: flex; gap: 8px; align-items: flex-start; }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.person { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); min-width: 0; }
.person .t { min-width: 0; }
.person b { display: block; font-weight: 600; font-size: 13px; }
.person span { font-size: 11.5px; color: var(--muted); }
.person .chip { margin-left: auto; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 14px 11px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
.tab .n { font-size: 10.5px; background: var(--surface-2); color: var(--muted); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.tab.ai { color: var(--blue); }
.tab.ai.on { color: var(--fg); }

.needs { background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 6px; }
.needs .eyebrow { color: var(--warn); }
.needs div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); }
.needs svg { color: var(--warn); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.kv > div { min-width: 0; }
.kv label { display: block; font-size: 11px; color: var(--muted); }
.kv p { margin: 1px 0 0; font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.kv p.hl { color: var(--accent-ink); font-weight: 600; }
.kv .full { grid-column: 1 / -1; }
.copy { border: 0; background: none; color: var(--faint); padding: 0 0 0 4px; vertical-align: -3px; }
.copy:hover { color: var(--fg); }
.overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.overview .wide { grid-column: 1 / -1; }

/* usługi */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.svc-card { padding: 18px; display: grid; gap: 12px; align-content: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.svc-card.live { cursor: pointer; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.svc-card.live:hover { transform: translateY(-1px); }
.svc-card.off { background: var(--surface-2); box-shadow: none; color: var(--faint); cursor: not-allowed; }
.svc-card.off .svc { background: var(--line); color: var(--muted); }
.svc-card h3 { font-size: 16px; font-weight: 600; }
.svc-card p { margin: 0; font-size: 12px; color: var(--muted); }
.svc-card.off p, .svc-card.off h3 { color: var(--faint); }
.svc-card .row { display: flex; align-items: center; gap: 8px; }
.svc-card .row .r { margin-left: auto; }
.svc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.modst.down { color: var(--bad); }
.lock { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--faint); }

.ic-pdf { background: var(--bad-soft); color: var(--bad); }
.ic-docx { background: var(--blue-soft); color: var(--blue); }
.ic-sheet { background: var(--good-soft); color: var(--good); }
.ic-gdoc { background: var(--blue-soft); color: var(--blue); }

.drop { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; justify-items: center; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }

/* notatki */
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.note { padding: 16px 18px; display: grid; gap: 8px; }
.note h3 { font-size: 14.5px; font-weight: 600; }

.note .confirm { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bad); margin-right: auto; }
.pin { color: var(--accent-ink); }

/* aktywność */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fbtn { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--muted); }

.tl { display: grid; padding: 6px 20px 14px; }
.tl-m { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px 46px; }

.src-sys { background: var(--surface-2); color: var(--muted); }

.tl-i .meta { font-size: 11.5px; color: var(--muted); }

.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

.chat-in { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }

const MS = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
const ML = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const d = s => new Date(s.length <= 10 ? s + "T12:00:00" : s);
const fmt = s => { const x = d(s); return `${x.getDate()} ${MS[x.getMonth()]} ${x.getFullYear()}`; };
const fmtL = s => { const x = d(s); return `${x.getDate()} ${ML[x.getMonth()]} ${x.getFullYear()}`; };
const hm = s => { const x = d(s); return String(x.getHours()).padStart(2, "0") + ":" + String(x.getMinutes()).padStart(2, "0"); };
const days = s => Math.round((TODAY - d(s)) / 864e5);
const pln = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " zł";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const av = (p, lg) => `<div class="av${lg ? " lg" : ""}" style="background:${p.color}">${p.ini}</div>`;
const chipSt = s => `<span class="chip st-${s}"><span class="d"></span>${STATUS[s]}</span>`;
const tier = t => `<span class="tier tier-${t}" title="Tier ${t}">${t}</span>`;
const svcChips = (list, max = 3) => list.slice(0, max).map(s => `<span class="svc">${MOD[s].name}</span>`).join("") + (list.length > max ? `<span class="svc more">+${list.length - max}</span>` : "");
const $ = s => document.querySelector(s);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400); }
function copy(text) {
  const done = () => toast("Skopiowano: " + text);
  try { navigator.clipboard.writeText(text).then(done, () => toast(text)); } catch (e) { toast(text); }
}

/* ---------- czat (atrapa wewnętrznego LLM) ---------- */
function answer(c, q) {
  const s = q.toLowerCase();
  const K = c.contact, B = c.billing, D = c.dates;
  if (/telefon|numer|kontakt|zadzwoni|mail/.test(s))
    return [`Kontakt po stronie klienta: ${K.name}${K.role ? " (" + K.role + ")" : ""}\nTelefon: ${K.phone}\nE-mail: ${K.email}\nPreferuje: ${K.prefers}.` + (c.id === "simple" ? "\n\nSprawy techniczne: developer klienta Paweł, pawel@simple-przyklad.pl (z notatki „Dostępy”)." : ""), "Karta klienta, notatka „Dostępy”"];
  if (/umow|wypowiedz|okres|aneks|zakres/.test(s))
    return [`Umowa: ${c.agreement}, start ${D.contractStart ? fmtL(D.contractStart) : "—"}.\nMinimalny okres: do ${D.minTerm ? fmtL(D.minTerm) : "—"}.\nOkres wypowiedzenia: ${B.notice}.\nWaloryzacja: ${D.indexation ? fmtL(D.indexation) : "—"}.` + (c.id === "simple" ? "\nAneks nr 1 (12 sie 2026) rozszerzył content o 4 artykuły miesięcznie." : ""), "Umowa o świadczenie usług SEO.pdf, Aneks nr 1.pdf"];
  if (/bud|faktur|płat|plat|kwot|ile płaci|nip/.test(s))
    return [`Budżet: ${pln(c.budget)} netto miesięcznie.\n${B.terms}.\nFaktury na: ${B.name}, NIP ${B.nip}, wysyłka na ${B.invoiceEmail}.\nOstatnia faktura: FV/09/2026/114 z 1 wrz 2026.`, "Rozliczenia, historia faktur"];
  if (/ewaluac|spotkan|przygot/.test(s))
    return [`Ewaluacja: ${D.evaluation ? fmtL(D.evaluation) : "brak terminu"}, 10:00, biuro klienta.\nDo przygotowania (z Twojej notatki):\n• porównanie widoczności czerwiec vs wrzesień: TOP10 142 frazy (+18%)\n• ruch organiczny z GA4: 4 820/mies. (+12%)\n• lista wdrożonych rekomendacji: meta w 48 kategoriach, dane strukturalne na 212 produktach, 2 nowe artykuły\n• pytanie o Google Ads od listopada`, "Notatka „Ewaluacja — co przygotować”, moduł SEO"];
  if (/dział|ostatn|podsum|co nowego|zrobi|aktywn/.test(s)) {
    const a = (ACTIVITY[c.id] || []).slice(0, 5).map(x => `• ${fmt(x.date)}: ${x.text}`).join("\n");
    return [`Ostatnie 5 zdarzeń:\n${a || "brak"}`, "Zakładka Aktywność"];
  }
  if (/seo|pozycj|wynik|ruch|fraz/.test(s) && c.seo)
    return [`Wyniki SEO (wrzesień 2026):\n• frazy w TOP10: ${c.seo.top10} (${c.seo.top10d} od startu)\n• ruch organiczny: ${c.seo.traffic}/mies. (${c.seo.trafficd})\n• kondycja techniczna: ${c.seo.health}\nOtwarty problem: LCP 3,4 s na kartach produktów, czeka na developera klienta.`, "Moduł SEO, raport sierpniowy"];
  return [`Mogę odpowiedzieć na pytania o ${c.name}: kontakty i telefony, zapisy umowy i aneksów, rozliczenia, historię współpracy, wyniki z modułów usług i przygotowanie do spotkań.\n\nTo prototyp, więc odpowiedzi są przykładowe. Docelowo odpowiada tu wewnętrzny model agencji podłączony do danych klienta.`, null];
}

function ask(c, q) {
  q = q.trim(); if (!q) return;
  state.chats[c.id].push({ who: "me", text: q });
  state.typing = c.id; render();
  setTimeout(() => { const [t, src] = answer(full(c), q); state.chats[c.id].push({ who: "ai", text: t, src }); state.typing = null; render(); }, 700);
}

function render() {
  const r = parse();
  renderSide(r);
  const page = $("#page");
  let title = "Pulpit";
  if (r.view === "projekty") { title = "Projekty"; page.innerHTML = viewProjects(); }
  else if (r.view === "klient") { title = CL[r.id] ? CL[r.id].name : "Klient"; page.innerHTML = viewClient(r); }
  else if (r.view === "usluga") { title = "Usługa"; page.innerHTML = viewService(r); }
  else { page.innerHTML = viewDashboard(); }
  $("#title").textContent = title;
  $("#app").classList.remove("open");
  const msgs = $("#msgs"); if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

/* ================= ZDARZENIA ================= */
function saveNotes() { store.set("notes", state.notes); }
function saveDocs() { store.set("docs", state.docs); }
function addFiles(files) {
  const r = parse(); const list = state.docs[r.id] || (state.docs[r.id] = []);
  [...files].forEach(f => {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const kind = ext === "pdf" ? "pdf" : /docx?/.test(ext) ? "docx" : /xlsx?|csv/.test(ext) ? "sheet" : /pptx?/.test(ext) ? "slides" : "file";
    const size = f.size > 1e6 ? (f.size / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(f.size / 1e3)) + " KB";
    list.unshift({ kind, title: f.name, meta: `${ext.toUpperCase() || "PLIK"} · ${size} · dodano ${fmt("2026-09-30")} przez Anna Lis` });
  });
  saveDocs(); render(); toast(`Dodano ${files.length} ${files.length === 1 ? "plik" : "pliki"}`);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-soon],[data-copy],[data-edit],[data-cancel],[data-askdel],[data-delnote],[data-pin],[data-newnote],[data-actf],[data-deldoc],[data-ask],#drop,#menu,#scrim");
  if (!t) return;
  const r = parse();
  if (t.id === "menu") return $("#app").classList.toggle("open");
  if (t.id === "scrim") return $("#app").classList.remove("open");
  if (t.id === "drop") return $("#file").click();
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.soon) return toast(`${t.dataset.soon} — w kolejnym etapie`);
  if (t.dataset.copy) return copy(t.dataset.copy);
  if (t.dataset.actf) { state.actFilter = t.dataset.actf; return render(); }
  if (t.dataset.ask) { const c = CL[r.id]; return ask(c, t.dataset.ask); }
  if (t.hasAttribute("data-deldoc")) {
    const list = state.docs[r.id]; const x = list.splice(+t.dataset.deldoc, 1)[0];
    saveDocs(); render(); return toast(`Usunięto: ${x.title}`);
  }
  const notes = state.notes[r.id] || (state.notes[r.id] = []);
  if (t.hasAttribute("data-newnote")) {
    const n = { id: "n" + Date.now(), title: "", body: "", author: "Anna Lis", date: "2026-09-30", pinned: false, fresh: true };
    notes.unshift(n); state.editing = n.id; state.confirmDel = null; render();
    const inp = document.querySelector(`[data-noteform="${n.id}"] input`); if (inp) inp.focus();
    return;
  }
  if (t.dataset.edit) { state.editing = t.dataset.edit; state.confirmDel = null; render(); const inp = document.querySelector(`[data-noteform="${t.dataset.edit}"] textarea`); if (inp) inp.focus(); return; }
  if (t.hasAttribute("data-cancel")) {
    const fresh = notes.find(n => n.id === state.editing && n.fresh);
    if (fresh) notes.splice(notes.indexOf(fresh), 1);
    state.editing = null; state.confirmDel = null; return render();
  }
  if (t.dataset.askdel) { state.confirmDel = t.dataset.askdel; return render(); }
  if (t.dataset.delnote) { notes.splice(notes.findIndex(n => n.id === t.dataset.delnote), 1); state.confirmDel = null; saveNotes(); render(); return toast("Notatka usunięta"); }
  if (t.dataset.pin) { const n = notes.find(n => n.id === t.dataset.pin); n.pinned = !n.pinned; saveNotes(); return render(); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target; const r = parse();
  if (f.dataset.noteform) {
    const n = (state.notes[r.id] || []).find(n => n.id === f.dataset.noteform);
    n.title = f.title.value.trim() || "Bez tytułu"; n.body = f.body.value.trim();
    if (!n.fresh) n.edited = true; delete n.fresh;
    state.editing = null; saveNotes(); render(); return toast("Notatka zapisana");
  }
  if (f.id === "addlink") {
    const url = $("#lu").value.trim(); const [kind, label] = kindFromUrl(url);
    (state.docs[r.id] || (state.docs[r.id] = [])).push({ kind, title: $("#lt").value.trim(), url, meta: `${label} · dodano 30 wrz 2026` });
    saveDocs(); render(); return toast("Link dodany");
  }
  if (f.id === "chatf") { const q = $("#chatq").value; return ask(CL[r.id], q); }
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "pq") { state.filters.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#pq"); i.focus(); i.setSelectionRange(pos, pos); }
  if (id === "gsearch") {
    state.filters.q = e.target.value;
    if (parse().view !== "projekty") { go("projekty"); }
    else render();
    setTimeout(() => { const g = $("#gsearch"); g.focus(); }, 0);
  }
});
document.addEventListener("change", e => {
  const m = { pstatus: "status", ptier: "tier", psvc: "svc" }[e.target.id];
  if (m) { state.filters[m] = e.target.value; render(); }
  if (e.target.id === "file" && e.target.files.length) { addFiles(e.target.files); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "drop" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("#file").click(); }
  if (e.key === "Enter" && e.target.closest("tr[data-go]")) go(e.target.closest("tr[data-go]").dataset.go);
});
["dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest("#drop"); if (!z) return;
  e.preventDefault();
  z.classList.toggle("over", ev === "dragover");
  if (ev === "drop" && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
}));

render();
})();
</script>
